<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}mailwarden{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="/static/logo-64.png">
  <link rel="apple-touch-icon" href="/static/logo-180.png">
</head>

<body>
  <header class="top">
    <h1 class="site-title">
      <span class="mail-word">Mail</span><span class="warden-word">warden</span>
    </h1>
    <nav>
      {% for href, label in [("/", "Urgent"), ("/applications", "Applications"), ("/jobs", "Job alerts"), ("/digest",
      "Digest"), ("/sensitive", "Sensitive"), ("/settings", "Settings")] %}
      <a href="{{ href }}" {% if path==href %} aria-current="page" {% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Sign out</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>

</html>
