# mailwarden settings. NON-SECRET values only.
# Secrets (OAuth tokens, DB key, API keys) live in the OS keyring, never here.
# This file must be chmod 600; mailwarden refuses to start otherwise.

user_id = "local"

[llm]
# "groq":   cloud, free tier. Receives ONLY the redacted text of mail the local
#           sensitivity gate marked SAFE. Requires [groq] enabled = true and a key
#           stored with `mailwarden set-groq-key`.
# "ollama": fully local alternative (needs Ollama installed); nothing leaves the machine.
backend = "groq"
# Subject + first N characters of the body are sent for classification.
max_body_chars = 1500
# Local rate limit (token bucket). Groq's free tier allows 8K tokens/min,
# about 6 emails/min. Mail beyond max_llm_calls_per_run waits for the next run.
max_llm_calls_per_minute = 6
max_llm_calls_per_run = 150

[groq]
# Explicit opt-in to sending redacted SAFE text to api.groq.com.
# Keep your Groq org on the free tier (no billing method): it cannot incur charges,
# it is rate-limited instead. Enable Zero Data Retention in Groq's Data Controls.
enabled = true
# Any Groq model that supports strict structured outputs, e.g.
# "openai/gpt-oss-20b" (fast), "openai/gpt-oss-120b", "qwen/qwen3.8-27b".
model = "openai/gpt-oss-20b"
reasoning_effort = "low"
timeout_seconds = 60

[ollama]
# Only used when llm.backend = "ollama". Must be localhost / 127.0.0.1.
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"
timeout_seconds = 180

[gmail]
# First run backfills only this many days (also used if Gmail's history cursor expires).
full_sync_days = 7
max_messages_per_run = 200

[outlook]
enabled = false

[dashboard]
# Loopback only; any other value is refused.
host = "127.0.0.1"
port = 8765

[notifications]
enabled = true
# auto | terminal-notifier | osascript | desktop-notifier | none
# macOS: `brew install terminal-notifier` so clicking a notification opens the entry.
backend = "auto"

[digest]
# Local times the scheduled digest runs.
times = ["08:00", "18:00"]
# Optional Markdown copy of each digest, e.g. "~/Documents/mailwarden-digests". Empty = off.
markdown_dir = ""
