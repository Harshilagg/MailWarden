# mailwarden settings. NON-SECRET values only.
# Secrets (OAuth tokens, DB key, API keys) live in the OS keyring, never here.
# This file must be chmod 600; mailwarden refuses to start otherwise.

user_id = "local"

[llm]
# "groq":   cloud, free tier. Receives ONLY the redacted text of mail the local
#           sensitivity gate marked SAFE. Requires [groq] enabled = true and a key
#           stored with `mailwarden set-groq-key`.
# "ollama": fully local alternative (needs Ollama installed); nothing leaves the machine.
backend = "groq"
# Subject + first N characters of the body are sent for classification.
max_body_chars = 1500
# Local rate limit (token bucket). Groq's free tier allows 8K tokens/min,
# about 6 emails/min. Mail beyond max_llm_calls_per_run waits for the next run.
max_llm_calls_per_minute = 6
max_llm_calls_per_run = 150

[groq]
# Explicit opt-in to sending redacted SAFE text to api.groq.com.
# Keep your Groq org on the free tier (no billing method): it cannot incur charges,
# it is rate-limited instead. Enable Zero Data Retention in Groq's Data Controls.
enabled = true
# Any Groq model that supports strict structured outputs, e.g.
# "openai/gpt-oss-20b" (fast), "openai/gpt-oss-120b", "qwen/qwen3.8-27b".
model = "openai/gpt-oss-20b"
reasoning_effort = "low"
timeout_seconds = 60

[ollama]
# Only used when llm.backend = "ollama". Must be localhost / 127.0.0.1.
base_url = "http://127.0.0.1:11434"
model = "qwen2.5:3b"
timeout_seconds = 180

[gmail]
# First run backfills only this many days (also used if Gmail's history cursor expires).
full_sync_days = 7
max_messages_per_run = 200

[outlook]
enabled = false

[dashboard]
# Loopback only; any other value is refused.
host = "127.0.0.1"
port = 8765

[notifications]
enabled = true
# auto | terminal-notifier | osascript | desktop-notifier | none
# macOS: `brew install terminal-notifier` so clicking a notification opens the entry.
backend = "auto"

[digest]
# Local times the scheduled digest runs.
times = ["08:00", "18:00"]
# Optional Markdown copy of each digest, e.g. "~/Documents/mailwarden-digests". Empty = off.
markdown_dir = ""

[job_alerts]
# Jobs extracted from job-alert emails are shown on the dashboard's "Job alerts" page.
# Matching jobs are highlighted: title contains a keyword AND location matches (or is unknown).
target_keywords = ["software engineer", "backend", "full stack", "sde"]
target_locations = ["Bengaluru", "Remote"]
# At most one "N new jobs scored 7+" notification per day, never one per alert email.
daily_notification = true
# Companies you especially want: their jobs get +1 rank in "Apply today".
watchlist = []
# How many jobs "Apply today" shows.
apply_today_count = 8
# "Apply today" picks only jobs first seen in the last N days: a daily shortlist (0 = any age).
apply_today_days = 3
# At most this share of "Apply today" from one role family (Go, Java, Python, full stack/web, AI/ML ...).
# Generic titles (Software Engineer, SDE) are never capped. 0 = no cap.
max_family_share = 0.25
# A job expires when no alert has shown it for this many days, or its posting is gone (moves to the
# Expired tab; never deleted). 0 = never by age.
expire_after_days = 14
# Fetch job descriptions automatically for candidates on Greenhouse, Lever or Ashby (public APIs).
jd_auto_fetch = true
# "Fetch job description" buttons (allowlisted hiring systems only). Opt-in: set true to enable.
jd_button_fetch = false
max_jd_fetches_per_run = 30
# Fit scores per run (one LLM call each).
max_scores_per_run = 40
