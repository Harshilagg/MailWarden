# mailwarden sender tiers. Edit freely; must stay chmod 600.
#
#   domains: matches the domain AND all its subdomains
#            (hdfcbank.net also matches alerts.hdfcbank.net)
#   senders: exact addresses; an address rule beats a domain rule
#
# PRIORITY  job mail; still passes the sensitivity gate and redaction.
# SENSITIVE never sent to any LLM; only sender name/time/account stored.
# IGNORE    counted in the digest; never classified.
#
# An entry may appear in only one tier. Move entries with:
#   mailwarden promote <address-or-domain> <priority|sensitive|ignore|default>

